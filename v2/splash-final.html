<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf3;display:flex;justify-content:center;align-items:center;height:100vh}
.phone{width:240px;height:480px;border-radius:30px;position:relative;overflow:hidden;border:4px solid #0b1220;background:#060b16}
/* 背後のアプリ(モック) */
.app{position:absolute;inset:0;padding:16px;color:#9fb2cf;font-family:-apple-system,'Segoe UI',sans-serif}
.app .bar{height:30px;border-radius:8px;background:#0e1a30;margin-bottom:12px;display:flex;align-items:center;padding:0 10px;color:#dce8ff;font-size:12px;font-weight:700}
.app .card{height:54px;border-radius:10px;background:#0c1426;margin-bottom:10px}
/* スプラッシュ(本番CSSをそのまま) */
.splash{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#03060f;animation:splashAutoOut .6s ease 1.7s forwards}
.splash--hide{animation:none;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,visibility 0s linear .5s}
.splash svg{filter:drop-shadow(0 10px 34px rgba(34,211,238,.18))}
.splash__bulb{animation:splashFadeIn .4s ease both}
.splash__bglow{transform-box:fill-box;transform-origin:center;animation:splashGlow 1.7s ease-out both}
.splash__stem{transform-box:fill-box;transform-origin:50% 100%;animation:splashStem .55s cubic-bezier(.2,.7,.3,1) .25s both}
.splash__leafL{transform-box:fill-box;transform-origin:100% 70%;animation:splashLeaf .5s cubic-bezier(.2,.8,.3,1) .6s both}
.splash__leafR{transform-box:fill-box;transform-origin:0% 70%;animation:splashLeaf .5s cubic-bezier(.2,.8,.3,1) .72s both}
.splash__seed{animation:splashFadeIn .4s ease .95s both}
@keyframes splashFadeIn{from{opacity:0}to{opacity:1}}
@keyframes splashStem{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes splashLeaf{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes splashGlow{0%{opacity:.08}60%{opacity:.42}100%{opacity:.2}}
@keyframes splashAutoOut{to{opacity:0;visibility:hidden;pointer-events:none}}
</style></head><body>
<div class="phone">
  <div class="app"><div class="bar">AI Tech Researcher</div><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div></div>
  <div class="splash" id="sp">
    <svg width="140" height="154" viewBox="0 0 100 110">
      <circle class="splash__bglow" cx="50" cy="44" r="30" fill="#22d3ee" opacity="0.2"/>
      <g class="splash__bulb">
        <circle cx="50" cy="44" r="26" fill="#0a1326" stroke="#38bdf8" stroke-width="3.4"/>
        <path d="M40 66 L41.5 80 L58.5 80 L60 66 Z" fill="#0a1326" stroke="#38bdf8" stroke-width="3.4" stroke-linejoin="round"/>
        <line x1="43" y1="85" x2="57" y2="85" stroke="#64748b" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="44" y1="90" x2="56" y2="90" stroke="#64748b" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="45" y1="95" x2="55" y2="95" stroke="#64748b" stroke-width="2.6" stroke-linecap="round"/>
      </g>
      <rect class="splash__stem" x="48.4" y="44" width="3.2" height="22" rx="1.6" fill="#34d399"/>
      <path class="splash__leafL" d="M50 54 C44 50 37 47 32 49 C35 54 43 55 50 54 Z" fill="#34d399"/>
      <path class="splash__leafR" d="M50 50 C56 46 63 43 68 45 C65 50 57 51 50 50 Z" fill="#5fe6ab"/>
      <circle class="splash__seed" cx="50" cy="44" r="2.2" fill="#eafff5"/>
    </svg>
  </div>
</div>
<script>setTimeout(()=>document.getElementById('sp').classList.add('splash--hide'),1400)</script>
</body></html>

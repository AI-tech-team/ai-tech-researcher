name: Research Pipeline

on:
  schedule:
    # ⚠ GitHub Actions の `schedule` は大幅に遅れる。時刻が重要なものをここに置いてはいけない。
    #   2026-09-12 実測（直近20日・pipeline_logs から逆算）: 遅延の中央値 +167分、最大 +482分。
    #   8月下旬は +37〜47分だったので悪化し続けている。旧 '7 18'（03:07 JST）は 06:00 まで
    #   173分しか余裕が無く、遅延だけで食い潰されて実際の起動が 05:54・終了が 06:31 JST に
    #   なっていた＝メールが6:30着になっていた原因。
    #
    #   → フル実行とレポート配信（＝時刻の約束があるもの）は `schedule` から外し、
    #     外部スケジューラが GitHub API で `workflow_dispatch` を叩いて起動する。
    #     dispatch イベントは schedule の待ち行列に入らないので遅れない。
    #       03:07 JST → report_type=daily （収集〜知識抽出）
    #       06:00 JST → report_type=report（レポート生成＋配信）
    #     設定手順は docs/external-scheduler.md。
    #
    #   ここに残す `schedule` は「遅れても害が無いもの」＋「外部スケジューラが死んだときの保険」。
    #   保険が同時に走っても二重にはならない: runDailyReportAndDistribute() が
    #   「その日の号が既にあればスキップ」する（冪等）ので、生成も配信も1日1回に閉じる。
    # 収集は1日6回。3回だと 18:00→翌03:07 の9時間が空き、公開から収集までの遅れが
    # 中央値5.7時間・6時間以内は52.5%しかなかった（実測14日3,078本）。
    # リポジトリは公開なので Actions の実行時間は無料。
    - cron: '17 21 * * *'     # 毎日 06:17 JST (collect-only)
    - cron: '17 0 * * *'      # 毎日 09:17 JST (collect-only)
    - cron: '17 3 * * *'      # 毎日 12:17 JST (collect-only＋レポート自己修復)
    - cron: '17 6 * * *'      # 毎日 15:17 JST (collect-only)
    - cron: '17 9 * * *'      # 毎日 18:17 JST (collect-only)
    - cron: '17 12 * * *'     # 毎日 21:17 JST (collect-only)
    - cron: '43 20 * * 0'     # 毎週日曜 05:43 JST (週次バックアップ)
    # 保険: 外部スケジューラが止まっていても「朝刊が出ない日」は作らない。
    # 外部スケジューラが生きていれば、こちらが走る頃には当日の号が既にあるので
    # runDailyReportAndDistribute() の冪等ガードでスキップされる（生成も配信も1日1回）。
    #
    # ⚠ フル実行（収集〜知識抽出）には保険を置かない。冪等ガードが無く、遅延込みで
    #   外部トリガとほぼ同時刻に走るため、収集もキーワードGrounding課金も二重になる。
    #   外部スケジューラが止まった場合、収集は下の collect 6回が続けるが、知識抽出・埋め込み・
    #   翻訳・週次/月次は走らない（＝設定は後回しにしないこと）。
    - cron: '11 21 * * *'     # 毎日 06:11 JST (保険: report のみ)
    # ※ 週次/月次レポートは daily pipeline(full) が日曜/月初に判定して生成する（サイト掲載のみ・メールなし）。
  workflow_dispatch:
    inputs:
      report_type:
        description: '実行するレポート種別'
        required: false
        default: 'daily'
        type: choice
        options: [daily, report, collect, backup, restory, deep, chunks]
      limit:
        description: '1回の処理件数（deep/chunks のみ。空ならステップ既定値）'
        required: false
        default: ''
        type: string

# リポジトリ設定の既定は write（実測）＝全ステップが GITHUB_TOKEN で contents/actions/packages を
# 書き換えられる状態だった。本番secretを載せたまま毎晩無人で走るため、必要な contents:write だけに絞る
# （週次バックアップの `git push origin main` がこれを使う）。
permissions:
  contents: write

# 同じ種別の実行が重ならないようにする。フル実行は45分以上かかるうえ、起動経路が
# 外部スケジューラ・scheduleの保険・手動と複数あるため、重なると収集もキーワード
# Grounding課金も二重になる（2026-09-12、動作確認中に実際に2本同時に走らせた）。
# cancel-in-progress: false ＝ 走っている方を優先し、後発は待たせる（途中で殺さない）。
concurrency:
  group: pipeline-${{ github.event.inputs.report_type || github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json

      # npm install は package-lock.json を無視して semver 範囲内の最新を取りに行く＝毎晩、無人で
      # 未検証の新バージョンを本番secret入りの環境に取り込んでいた。npm ci はロックファイルの
      # 完全一致（integrity 付き）でしか入れない。
      - name: Install dependencies
        run: cd v2 && npm ci

      # 日次フルパイプライン: 収集・ベクトル化・知識抽出・(日曜/月初は週次/月次レポート生成)。
      # デイリーレポートの生成＋メールはここでは行わず、下の Report ステップが 06:00 JST に実行する。
      - name: Run Daily Pipeline (full)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'daily'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # 配信停止リンクの署名に使う。Vercel 側と同一値でないと /api/unsubscribe が検証に失敗する。
          # 未設定だと unsubscribeUrl() が受信者ごとに例外を投げ、try/catch に飲まれて「0/N件」で
          # 静かに終わる（2026-09-10 の是正でリンクを入れた際に渡し忘れていた）。
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          REPORT_TO: ${{ secrets.REPORT_TO }}   # 失敗通知メールの宛先
        run: cd v2 && npx tsx daily_pipeline.ts

      # レポート生成＋購読者全員へ同一ダイジェスト配信。外部スケジューラが 06:00 JST に叩く。
      - name: Generate & Send Daily Report (06:00 JST)
        if: always() && (github.event.schedule == '11 21 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'report'))
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # 配信停止リンクの署名に使う。Vercel 側と同一値でないと /api/unsubscribe が検証に失敗する。
          # 未設定だと unsubscribeUrl() が受信者ごとに例外を投げ、try/catch に飲まれて「0/N件」で
          # 静かに終わる（2026-09-10 の是正でリンクを入れた際に渡し忘れていた）。
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          REPORT_TO: ${{ secrets.REPORT_TO }}   # 失敗通知メールの宛先
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}    # v10: Web Push（未設定なら送信スキップ）
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}          # 任意（mailto:）
          SITE_URL: ${{ secrets.SITE_URL }}                    # 通知タップ先（任意・既定はvercel URL）
          PIPELINE_MODE: report
        run: cd v2 && npx tsx daily_pipeline.ts

      - name: Run Collection (09/12/15/18/21 JST)
        if: github.event.schedule == '17 21 * * *' || github.event.schedule == '17 0 * * *' || github.event.schedule == '17 3 * * *' || github.event.schedule == '17 6 * * *' || github.event.schedule == '17 9 * * *' || github.event.schedule == '17 12 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'collect')
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # 配信停止リンクの署名に使う。Vercel 側と同一値でないと /api/unsubscribe が検証に失敗する。
          # 未設定だと unsubscribeUrl() が受信者ごとに例外を投げ、try/catch に飲まれて「0/N件」で
          # 静かに終わる（2026-09-10 の是正でリンクを入れた際に渡し忘れていた）。
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          PIPELINE_MODE: collect
        run: cd v2 && npx tsx daily_pipeline.ts

      # ストーリーグループ再構築（手動のみ）。既存ベクトルだけを使うのでGemini APIは消費しない。
      # 連鎖マージで別記事が重複扱いされ一覧から消えていた分を解放する（[[debug-story-overmerge]]）。
      - name: Restory (rebuild story groups)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'restory'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # restory自体はGeminiを呼ばない（＝課金なし）が、クライアントがモジュール評価時に初期化されるため渡す。
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          PIPELINE_MODE: restory
        run: cd v2 && npx tsx daily_pipeline.ts

      # v3 Phase3: 本文抽出の滞留分(imp>=7・本文なし 約6600件)を回収する（[[pattern-throughput-starvation]]）。
      # fetchのみでLLM不使用＝Gemini課金なし。試行記録により冪等＝完了まで繰り返し実行してよい。
      - name: Deep extract (backfill article bodies)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'deep'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # deep自体はGeminiを呼ばない（＝課金なし）が、クライアントがモジュール評価時に初期化されるため渡す。
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          PIPELINE_MODE: deep
          DEEP_LIMIT: ${{ github.event.inputs.limit || '1500' }}
        run: cd v2 && npx tsx daily_pipeline.ts

      # v3 Phase3の仕上げ: 本文チャンク埋め込みのバックフィル。deepで本文が11.8%→69.7%に増えた分、
      # チャンク未生成の記事(実測6528件・22,967チャンク)を埋める。ハイブリッド検索の本文レーンが
      # 全記事の11.7%しかカバーできていなかったのを解消する。
      # Gemini埋め込みを消費する（実測 最大¥618・gemini-embedding-001 $0.15/1Mトークン）。
      # 既にチャンクがある記事はSQLで除外されるため冪等＝完了まで繰り返し実行してよい。
      - name: Chunk embeddings (backfill)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'chunks'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          PIPELINE_MODE: chunks
          CHUNK_LIMIT: ${{ github.event.inputs.limit || '3500' }}
        run: cd v2 && npx tsx daily_pipeline.ts

      - name: Weekly DB Backup
        if: github.event.schedule == '43 20 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'backup')
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: cd v2 && npx tsx scripts/backup.ts

      - name: Commit DB Backup
        if: github.event.schedule == '43 20 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'backup')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2/backups/ || true
          # ⚠ [skip ci] を必ず付ける。Vercel を GitHub 連携すると push ごとに本番ビルドが走るため、
          #   これが無いと**毎週日曜、中身が1行も変わっていない本番デプロイ**が1回走る（2026-09-13）。
          #   Vercel は [skip ci] / [skip cd] / [skip vercel] を見てデプロイを飛ばす。
          git diff --staged --quiet || git commit -m "chore: weekly DB backup $(date +%Y-%m-%d) [skip ci]"
          git push origin main || true

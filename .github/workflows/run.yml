name: Research Pipeline

on:
  schedule:
    # GitHub Actions の schedule は数十分〜1時間程度遅延するため、フル実行は早朝に前倒しし、
    # レポート生成＋メール配信は同ジョブ内で 21:00 UTC (06:00 JST) まで待機してから実行する。
    - cron: '7 19 * * *'      # 毎日 04:07 JST 起動 (full: 収集〜知識抽出 → 06:00 JST にレポート生成＋配信)
    - cron: '0 3 * * *'       # 毎日 12:00 JST (collect-only＋レポート自己修復)
    - cron: '0 9 * * *'       # 毎日 18:00 JST (collect-only)
    - cron: '0 20 * * 0'      # 毎週日曜 05:00 JST (週次バックアップ)
    # ※ 週次/月次レポートは daily pipeline(full) が日曜/月初に判定して生成する（サイト掲載のみ・メールなし）。
  workflow_dispatch:
    inputs:
      report_type:
        description: '実行するレポート種別'
        required: false
        default: 'daily'
        type: choice
        options: [daily, report, collect, backup]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: cd v2 && npm install

      # 日次フルパイプライン: 収集・ベクトル化・知識抽出・(日曜/月初は週次/月次レポート生成)。
      # デイリーレポートの生成＋メールはここでは行わず、下の Report ステップが 06:00 JST に実行する。
      - name: Run Daily Pipeline (full)
        if: github.event.schedule == '7 19 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'daily')
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}   # 失敗通知メールの宛先
        run: cd v2 && npx tsx daily_pipeline.ts

      # 06:00 JST (21:00 UTC) ちょうどまで待機。起動遅延があっても 04:07 JST 起動＋約2時間の余裕で吸収する。
      # 万一 06:00 を過ぎて起動した場合は待たずに即レポートを生成する（遅れてでも届ける）。
      # always(): フル実行が失敗した日でも 06:00 のレポート配信は止めない（自己修復と二重の保険）
      - name: Wait until 06:00 JST
        if: always() && github.event.schedule == '7 19 * * *'
        run: |
          target=$(date -u -d 'today 21:00' +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Waiting $((target - now))s until 21:00 UTC (06:00 JST)"
            sleep $((target - now))
          else
            echo "Already past 21:00 UTC, generating report immediately"
          fi

      # デイリーレポート生成＋購読者全員へ同一ダイジェスト配信（06:00 JST ピッタリ）
      - name: Generate & Send Daily Report (06:00 JST)
        if: always() && (github.event.schedule == '7 19 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'report'))
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}   # 失敗通知メールの宛先
          PIPELINE_MODE: report
        run: cd v2 && npx tsx daily_pipeline.ts

      - name: Run Collection (midday/evening)
        if: github.event.schedule == '0 3 * * *' || github.event.schedule == '0 9 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'collect')
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          PIPELINE_MODE: collect
        run: cd v2 && npx tsx daily_pipeline.ts

      - name: Weekly DB Backup
        if: github.event.schedule == '0 20 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'backup')
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: cd v2 && npx tsx scripts/backup.ts

      - name: Commit DB Backup
        if: github.event.schedule == '0 20 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'backup')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2/backups/ || true
          git diff --staged --quiet || git commit -m "chore: weekly DB backup $(date +%Y-%m-%d)"
          git push origin main || true

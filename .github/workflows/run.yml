name: Research Pipeline

on:
  schedule:
    # GitHub Actions の schedule は大幅に遅延する（2026-07-08 実測+1h49m）ため、フル実行は
    # 深夜に前倒しし、レポート生成＋メール配信は同ジョブ内で 21:00 UTC (06:00 JST) まで待機してから実行する。
    - cron: '7 18 * * *'      # 毎日 03:07 JST 起動 (full: 収集〜知識抽出 → 06:00 JST にレポート生成＋配信)
    - cron: '0 3 * * *'       # 毎日 12:00 JST (collect-only＋レポート自己修復)
    - cron: '0 9 * * *'       # 毎日 18:00 JST (collect-only)
    - cron: '0 20 * * 0'      # 毎週日曜 05:00 JST (週次バックアップ)
    # ※ 週次/月次レポートは daily pipeline(full) が日曜/月初に判定して生成する（サイト掲載のみ・メールなし）。
  workflow_dispatch:
    inputs:
      report_type:
        description: '実行するレポート種別'
        required: false
        default: 'daily'
        type: choice
        options: [daily, report, collect, backup, restory, deep, chunks]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: cd v2 && npm install

      # 日次フルパイプライン: 収集・ベクトル化・知識抽出・(日曜/月初は週次/月次レポート生成)。
      # デイリーレポートの生成＋メールはここでは行わず、下の Report ステップが 06:00 JST に実行する。
      - name: Run Daily Pipeline (full)
        if: github.event.schedule == '7 18 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'daily')
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}   # 失敗通知メールの宛先
        run: cd v2 && npx tsx daily_pipeline.ts

      # 06:00 JST (21:00 UTC) ちょうどまで待機。起動遅延があっても 03:07 JST 起動＋約3時間の余裕で吸収する。
      # 万一 06:00 を過ぎて起動した場合は待たずに即レポートを生成する（遅れてでも届ける）。
      # always(): フル実行が失敗した日でも 06:00 のレポート配信は止めない（自己修復と二重の保険）
      - name: Wait until 06:00 JST
        if: always() && github.event.schedule == '7 18 * * *'
        run: |
          target=$(date -u -d 'today 21:00' +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Waiting $((target - now))s until 21:00 UTC (06:00 JST)"
            sleep $((target - now))
          else
            echo "Already past 21:00 UTC, generating report immediately"
          fi

      # デイリーレポート生成＋購読者全員へ同一ダイジェスト配信（06:00 JST ピッタリ）
      - name: Generate & Send Daily Report (06:00 JST)
        if: always() && (github.event.schedule == '7 18 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'report'))
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}   # 失敗通知メールの宛先
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}    # v10: Web Push（未設定なら送信スキップ）
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}          # 任意（mailto:）
          SITE_URL: ${{ secrets.SITE_URL }}                    # 通知タップ先（任意・既定はvercel URL）
          PIPELINE_MODE: report
        run: cd v2 && npx tsx daily_pipeline.ts

      - name: Run Collection (midday/evening)
        if: github.event.schedule == '0 3 * * *' || github.event.schedule == '0 9 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'collect')
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          PIPELINE_MODE: collect
        run: cd v2 && npx tsx daily_pipeline.ts

      # ストーリーグループ再構築（手動のみ）。既存ベクトルだけを使うのでGemini APIは消費しない。
      # 連鎖マージで別記事が重複扱いされ一覧から消えていた分を解放する（[[debug-story-overmerge]]）。
      - name: Restory (rebuild story groups)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'restory'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # restory自体はGeminiを呼ばない（＝課金なし）が、クライアントがモジュール評価時に初期化されるため渡す。
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          PIPELINE_MODE: restory
        run: cd v2 && npx tsx daily_pipeline.ts

      # v3 Phase3: 本文抽出の滞留分(imp>=7・本文なし 約6600件)を回収する（[[pattern-throughput-starvation]]）。
      # fetchのみでLLM不使用＝Gemini課金なし。試行記録により冪等＝完了まで繰り返し実行してよい。
      - name: Deep extract (backfill article bodies)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'deep'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # deep自体はGeminiを呼ばない（＝課金なし）が、クライアントがモジュール評価時に初期化されるため渡す。
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          PIPELINE_MODE: deep
          DEEP_LIMIT: '1500'
        run: cd v2 && npx tsx daily_pipeline.ts

      # v3 Phase3の仕上げ: 本文チャンク埋め込みのバックフィル。deepで本文が11.8%→69.7%に増えた分、
      # チャンク未生成の記事(実測6528件・22,967チャンク)を埋める。ハイブリッド検索の本文レーンが
      # 全記事の11.7%しかカバーできていなかったのを解消する。
      # Gemini埋め込みを消費する（実測 最大¥618・gemini-embedding-001 $0.15/1Mトークン）。
      # 既にチャンクがある記事はSQLで除外されるため冪等＝完了まで繰り返し実行してよい。
      - name: Chunk embeddings (backfill)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'chunks'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          PIPELINE_MODE: chunks
          CHUNK_LIMIT: '3500'
        run: cd v2 && npx tsx daily_pipeline.ts

      - name: Weekly DB Backup
        if: github.event.schedule == '0 20 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'backup')
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: cd v2 && npx tsx scripts/backup.ts

      - name: Commit DB Backup
        if: github.event.schedule == '0 20 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'backup')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2/backups/ || true
          git diff --staged --quiet || git commit -m "chore: weekly DB backup $(date +%Y-%m-%d)"
          git push origin main || true
